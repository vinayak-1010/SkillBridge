[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbridge"
version = "0.1.0"
description = "A reliable local agent harness for small open-weight models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SkillBridge Contributors" }]
keywords = ["agent", "skills", "ollama", "llm", "cli", "open-weight"]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skillbridge = "skillbridge.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/skillbridge"
Repository = "https://github.com/your-org/skillbridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillbridge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
